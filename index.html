<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawaii Login</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.12.16/dist/framer-motion.umd.js"></script>
    <!-- Custom styles -->
    <style>
        body {
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 50%, #e1f5fe 100%);
            min-height: 100vh;
            font-family: 'Nunito', sans-serif;
        }
        .login-card {
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }
        .input-field {
            transition: all 0.3s ease;
            border-radius: 12px;
        }
        .input-field:focus {
            border-color: #ffb6c1;
            box-shadow: 0 0 0 3px rgba(255, 182, 193, 0.25);
        }
        .btn-primary {
            background-color: #ffb6c1;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #ff9eb5;
            transform: translateY(-2px);
        }
        .pet-container {
            position: absolute;
            right: -80px;
            top: 50%;
            transform: translateY(-50%);
            width: 120px;
            height: 120px;
            cursor: pointer;
        }
        @media (max-width: 640px) {
            .pet-container {
                right: auto;
                top: -60px;
                left: 50%;
                transform: translateX(-50%);
            }
        }
    </style>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="flex items-center justify-center p-4">
    <div class="relative w-full max-w-md bg-white p-8 login-card">
        <!-- Pet character -->
        <div id="pet" class="pet-container">
            <img src="./images/kawaii-pet.svg" alt="Kawaii Pet" class="w-full h-full object-contain">
        </div>

        <!-- Login/Signup Form -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Welcome Back!</h1>
            <p class="text-gray-600">Sign in to continue your journey</p>
        </div>

        <!-- Form Toggle -->
        <div class="flex justify-center mb-6">
            <div class="bg-gray-100 p-1 rounded-full flex">
                <button id="loginToggle" class="py-2 px-6 rounded-full bg-white shadow-sm font-medium text-gray-800">Login</button>
                <button id="signupToggle" class="py-2 px-6 rounded-full font-medium text-gray-600">Signup</button>
            </div>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" class="w-full p-3 border border-gray-300 input-field focus:outline-none" placeholder="your@email.com">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" class="w-full p-3 border border-gray-300 input-field focus:outline-none" placeholder="••••••••">
            </div>
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember" type="checkbox" class="h-4 w-4 text-pink-300 focus:ring-pink-200 border-gray-300 rounded">
                    <label for="remember" class="ml-2 block text-sm text-gray-700">Remember me</label>
                </div>
                <a href="#" class="text-sm font-medium text-pink-400 hover:text-pink-500">Forgot password?</a>
            </div>
            <button type="submit" class="w-full py-3 px-4 btn-primary text-white font-medium rounded-lg shadow-sm hover:shadow-md focus:outline-none">Sign in</button>
        </form>

        <!-- Signup Form (hidden by default) -->
        <form id="signupForm" class="space-y-4 hidden">
            <div>
                <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="fullName" class="w-full p-3 border border-gray-300 input-field focus:outline-none" placeholder="Your Name">
            </div>
            <div>
                <label for="signupEmail" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="signupEmail" class="w-full p-3 border border-gray-300 input-field focus:outline-none" placeholder="your@email.com">
            </div>
            <div>
                <label for="signupPassword" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="signupPassword" class="w-full p-3 border border-gray-300 input-field focus:outline-none" placeholder="••••••••">
            </div>
            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input type="password" id="confirmPassword" class="w-full p-3 border border-gray-300 input-field focus:outline-none" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full py-3 px-4 btn-primary text-white font-medium rounded-lg shadow-sm hover:shadow-md focus:outline-none">Create Account</button>
        </form>

        <!-- Social Login -->
        <div class="mt-6">
            <div class="relative">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white text-gray-500">Or continue with</span>
                </div>
            </div>

            <div class="mt-6 grid grid-cols-3 gap-3">
                <div>
                    <a href="#" class="w-full inline-flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                        <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill-rule="evenodd" d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" clip-rule="evenodd" />
                        </svg>
                    </a>
                </div>

                <div>
                    <a href="#" class="w-full inline-flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                        <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M8.29 20.251c7.547 0 11.675-6.253 11.675-11.675 0-.178 0-.355-.012-.53A8.348 8.348 0 0022 5.92a8.19 8.19 0 01-2.357.646 4.118 4.118 0 001.804-2.27 8.224 8.224 0 01-2.605.996 4.107 4.107 0 00-6.993 3.743 11.65 11.65 0 01-8.457-4.287 4.106 4.106 0 001.27 5.477A4.072 4.072 0 012.8 9.713v.052a4.105 4.105 0 003.292 4.022 4.095 4.095 0 01-1.853.07 4.108 4.108 0 003.834 2.85A8.233 8.233 0 012 18.407a11.616 11.616 0 006.29 1.84" />
                        </svg>
                    </a>
                </div>

                <div>
                    <a href="#" class="w-full inline-flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                        <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd" />
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/main.js"></script>
</body>
</html>
