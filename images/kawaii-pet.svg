<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cat Body (peeking from side) -->
  <g transform="translate(120, 120)">
    <!-- Head -->
    <circle cx="0" cy="0" r="70" fill="#FFA5BA" />
    
    <!-- Face -->
    <circle cx="-20" cy="-10" r="10" fill="white" /> <!-- Left eye background -->
    <circle cx="20" cy="-10" r="10" fill="white" /> <!-- Right eye background -->
    <circle cx="-20" cy="-10" r="5" fill="#333333" /> <!-- Left eye -->
    <circle cx="20" cy="-10" r="5" fill="#333333" /> <!-- Right eye -->
    
    <!-- Blush -->
    <circle cx="-30" cy="10" r="10" fill="#FF8FAA" opacity="0.7" />
    <circle cx="30" cy="10" r="10" fill="#FF8FAA" opacity="0.7" />
    
    <!-- Mouth -->
    <path d="M0,15 Q0,25 0,20 Q0,30 0,25" stroke="#333333" stroke-width="2" stroke-linecap="round" />
    <path d="M-10,15 C-5,20 5,20 10,15" stroke="#333333" stroke-width="2" fill="none" stroke-linecap="round" />
    
    <!-- Ears -->
    <path d="M-60,-30 Q-70,-60 -40,-50 Z" fill="#FFA5BA" />
    <path d="M60,-30 Q70,-60 40,-50 Z" fill="#FFA5BA" />
    <path d="M-55,-35 Q-65,-55 -45,-45 Z" fill="#FF8FAA" />
    <path d="M55,-35 Q65,-55 45,-45 Z" fill="#FF8FAA" />
    
    <!-- Paws (peeking over) -->
    <circle cx="-40" cy="50" r="15" fill="#FFA5BA" />
    <circle cx="-45" cy="45" r="5" fill="#FF8FAA" />
    
    <circle cx="40" cy="50" r="15" fill="#FFA5BA" />
    <circle cx="45" cy="45" r="5" fill="#FF8FAA" />
  </g>
</svg>